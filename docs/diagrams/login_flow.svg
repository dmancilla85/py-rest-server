</defs><rect x="30" y="10" width="140" height="42" rx="6" fill="#EBF3FF" stroke="#2E5BBA" stroke-width="1.5"/><text x="100" y="36" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="bold" fill="#1A237E">Client</text><rect x="270" y="10" width="140" height="42" rx="6" fill="#EBF3FF" stroke="#2E5BBA" stroke-width="1.5"/><text x="340" y="36" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="bold" fill="#1A237E">API Server</text><rect x="520" y="10" width="140" height="42" rx="6" fill="#EBF3FF" stroke="#2E5BBA" stroke-width="1.5"/><text x="590" y="36" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="bold" fill="#1A237E">MongoDB</text><line x1="100" y1="97" x2="100" y2="360" stroke="#90A4AE" stroke-width="1" stroke-dasharray="5,3"/><line x1="340" y1="97" x2="340" y2="360" stroke="#90A4AE" stroke-width="1" stroke-dasharray="5,3"/><line x1="590" y1="97" x2="590" y2="360" stroke="#90A4AE" stroke-width="1" stroke-dasharray="5,3"/><line x1="100" y1="117" x2="340" y2="117" stroke="#2E5BBA" stroke-width="1.5"  marker-end="url(#arrowhead)"/><text x="220.0" y="113" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="normal" fill="#37474F">POST /api/v1/auth/login  {email, password}</text><line x1="340" y1="153" x2="590" y2="153" stroke="#2E5BBA" stroke-width="1.5"  marker-end="url(#arrowhead)"/><text x="465.0" y="149" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="normal" fill="#37474F">users.find_one({email})</text><line x1="590" y1="181" x2="340" y2="181" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/><text x="465.0" y="177" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="normal" fill="#37474F">{user document}</text><path d="M340,213 Q380,213 380,227 Q380,241 340,241" fill="none" stroke="#546E7A" stroke-width="1.3" stroke-dasharray="4,2" marker-end="url(#arrowhead_gray)"/><text x="384" y="227" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="normal" fill="#37474F">bcrypt.checkpw(password)</text><path d="M340,249 Q380,249 380,263 Q380,277 340,277" fill="none" stroke="#546E7A" stroke-width="1.3" stroke-dasharray="4,2" marker-end="url(#arrowhead_gray)"/><text x="384" y="263" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="normal" fill="#37474F">create_access_token()</text><line x1="340" y1="285" x2="100" y2="285" stroke="#546E7A" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/><text x="220.0" y="281" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="normal" fill="#37474F">HTTP 200  {user, token}</text></svg>